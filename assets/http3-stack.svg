<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">HTTP/3 transport layers</title><desc id="desc">HTTP/3 uses QUIC. QUIC uses UDP over IP, with TLS 1.3 security integrated into QUIC.</desc><rect width="640" height="360" rx="24" fill="#fffefa"/><text x="40" y="38" fill="#c54f2b" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">HTTP/3 STACK</text><rect x="70" y="52" width="500" height="50" rx="11" fill="#c54f2b"/><text x="320" y="84" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700">HTTP/3 · HTTP semantics + frames</text><path d="M320 102v10" stroke="#1a2834" stroke-width="3"/><rect x="70" y="112" width="500" height="75" rx="11" fill="#146d69"/><text x="320" y="143" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="700">QUIC</text><text x="320" y="169" text-anchor="middle" fill="#e4f4ee" font-family="Arial,sans-serif" font-size="15">independent streams · secure connection · TLS 1.3</text><path d="M320 187v10" stroke="#1a2834" stroke-width="3"/><rect x="70" y="197" width="500" height="48" rx="11" fill="#e7f1ed" stroke="#9ebbb1" stroke-width="2"/><text x="320" y="228" text-anchor="middle" fill="#1a2834" font-family="Arial,sans-serif" font-size="19" font-weight="700">UDP</text><path d="M320 245v10" stroke="#1a2834" stroke-width="3"/><rect x="70" y="255" width="500" height="48" rx="11" fill="#e7f1ed" stroke="#9ebbb1" stroke-width="2"/><text x="320" y="286" text-anchor="middle" fill="#1a2834" font-family="Arial,sans-serif" font-size="19" font-weight="700">IP</text><text x="320" y="333" text-anchor="middle" fill="#55636c" font-family="Arial,sans-serif" font-size="14">TLS 1.3 is integrated into QUIC rather than layered over TCP.</text></svg>
