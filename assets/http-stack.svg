<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">The HTTP request and response model</title><desc id="desc">A browser sends an HTTP request through a transport layer to a server. The server returns an HTTP response.</desc><rect width="640" height="360" rx="24" fill="#fffefa"/><text x="40" y="47" fill="#c54f2b" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">THE WEB EXCHANGE</text><rect x="40" y="82" width="200" height="85" rx="12" fill="#e7f1ed" stroke="#9ebbb1" stroke-width="2"/><text x="140" y="119" text-anchor="middle" fill="#1a2834" font-family="Arial,sans-serif" font-size="22" font-weight="700">Browser</text><text x="140" y="145" text-anchor="middle" fill="#55636c" font-family="Arial,sans-serif" font-size="14">HTTP client</text><rect x="400" y="82" width="200" height="85" rx="12" fill="#e7f1ed" stroke="#9ebbb1" stroke-width="2"/><text x="500" y="119" text-anchor="middle" fill="#1a2834" font-family="Arial,sans-serif" font-size="22" font-weight="700">Web server</text><text x="500" y="145" text-anchor="middle" fill="#55636c" font-family="Arial,sans-serif" font-size="14">resource or API</text><path d="M250 105H385" fill="none" stroke="#c54f2b" stroke-width="4"/><path d="m376 96 12 9-12 9" fill="none" stroke="#c54f2b" stroke-width="4"/><text x="320" y="91" text-anchor="middle" fill="#1a2834" font-family="Arial,sans-serif" font-size="15" font-weight="700">Request</text><path d="M390 146H255" fill="none" stroke="#146d69" stroke-width="4"/><path d="m264 137-12 9 12 9" fill="none" stroke="#146d69" stroke-width="4"/><text x="320" y="177" text-anchor="middle" fill="#1a2834" font-family="Arial,sans-serif" font-size="15" font-weight="700">Response</text><rect x="92" y="220" width="456" height="74" rx="12" fill="#172b35"/><text x="320" y="250" text-anchor="middle" fill="#fffefa" font-family="Arial,sans-serif" font-size="15" font-weight="700">HTTP semantics</text><text x="320" y="275" text-anchor="middle" fill="#dce9e4" font-family="Arial,sans-serif" font-size="14">methods · status · fields · representations</text><text x="320" y="329" text-anchor="middle" fill="#55636c" font-family="Arial,sans-serif" font-size="14">Transport: TCP for HTTP/1.1 and HTTP/2 · QUIC for HTTP/3</text></svg>
